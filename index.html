<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cardinal.group</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070a;--s1:#111116;--s2:#1a1a22;--line:#2a2a34;--text:#f4f4f6;--mut:#9b9ba6;--pink:#ff7ab8;--violet:#8b5cf6;--ice:#cfd6ff;--grad:linear-gradient(120deg,#ff7ab8 0%,#c084fc 55%,#8b5cf6 100%);--pad:clamp(16px,4vw,56px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07070a}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 Manrope,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh;background-image:radial-gradient(900px 500px at 85% -5%,rgba(139,92,246,.22),transparent 60%),radial-gradient(700px 500px at -5% 20%,rgba(255,122,184,.14),transparent 60%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:28px;padding:14px var(--pad);background:rgba(7,7,10,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{font:900 18px/1 Unbounded,Arial,sans-serif;letter-spacing:.01em}
.logo i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:24px;margin-left:auto}
nav a{color:var(--mut);font-weight:600;font-size:14px;padding:6px 0;border-bottom:2px solid transparent;transition:color .15s}
nav a:hover,nav a.on{color:var(--text);border-color:var(--pink)}
.cartlink{display:flex;align-items:center;gap:8px;background:var(--grad);color:#14001f;font-weight:700;font-size:14px;border-radius:999px;padding:9px 16px}
.cartlink b{background:#14001f;color:#fff;border-radius:999px;min-width:22px;text-align:center;font-size:12px;padding:1px 6px}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:20px}
main{min-height:70vh}
.page{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wrap{padding:clamp(32px,5vw,64px) var(--pad)}
h1,h2,h3{font-family:Unbounded,Arial,sans-serif;margin:0;line-height:1.08}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:15px 28px;font-weight:700;background:var(--grad);color:#14001f;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px -8px rgba(192,132,252,.7)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--pink);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
/* home */
.hero{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:end;padding:clamp(36px,6vw,80px) var(--pad) 0;min-height:600px;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;background:var(--bgimg) center/cover;opacity:.22;mix-blend-mode:screen}
.hero::after{content:"";position:absolute;right:6%;bottom:-20%;width:520px;height:520px;background:radial-gradient(circle,rgba(255,122,184,.45),rgba(139,92,246,.25) 45%,transparent 70%);filter:blur(30px)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(38px,7vw,92px);font-weight:900;letter-spacing:-.02em;margin-bottom:20px}
.hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:46ch;color:#c9c9d3;margin:0 0 28px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap}
.hero .txt{align-self:center;padding-bottom:60px}
.hero figure{margin:0;justify-self:center}
.hero figure img{height:min(68vh,600px);width:auto}
.marq{overflow:hidden;border-bottom:1px solid var(--line);background:var(--s1)}
.marq div{display:flex;gap:48px;white-space:nowrap;padding:14px 0;width:max-content;animation:mq 28s linear infinite;font:700 14px Unbounded,Arial,sans-serif;color:var(--mut)}
.marq b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes mq{to{transform:translateX(-50%)}}
.sec{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.sec h2{font-size:clamp(24px,3.6vw,40px)}
.sec a{color:var(--pink);font-weight:700;font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tile{position:relative;min-height:340px;border-radius:20px;overflow:hidden;border:1px solid var(--line);display:flex;align-items:flex-end;padding:26px;isolation:isolate;transition:transform .25s,border-color .25s}
.tile:hover{transform:translateY(-4px);border-color:var(--pink)}
.tile img{position:absolute;right:-4%;top:6%;height:88%;width:auto;z-index:-1;object-fit:contain}
.tile.k{background:linear-gradient(150deg,#1b1b22,#050507 70%)}
.tile.p{background:linear-gradient(150deg,#ff9ccb,#c084fc 70%,#6d3df0)}
.tile.p,.tile.p h3{color:#1a0028}
.tile h3{font-size:clamp(22px,3vw,34px);margin-bottom:6px}
.tile span{font-weight:600;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.card{position:relative;display:flex;flex-direction:column;border-radius:20px;background:var(--s1);border:1px solid var(--line);overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-5px);border-color:rgba(255,122,184,.6);box-shadow:0 20px 50px -20px rgba(192,132,252,.5)}
.card .ph{position:relative;aspect-ratio:4/5;background:radial-gradient(circle at 50% 40%,#23232d,#0a0a0e);overflow:hidden}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:10px;transition:opacity .3s}
.card .ph img+img{opacity:0}
.card:hover .ph img+img{opacity:1}
.tag{position:absolute;top:14px;left:14px;z-index:2;background:var(--grad);color:#14001f;font-weight:700;font-size:12px;border-radius:999px;padding:4px 10px}
.card .bd{padding:18px;display:grid;gap:6px}
.card h3{font:600 17px/1.3 Manrope,Arial,sans-serif}
.card .sub{color:var(--mut);font-size:14px}
.price{font:700 18px Unbounded,Arial,sans-serif}
.soon{display:flex;align-items:center;justify-content:center;text-align:center;min-height:360px;border-style:dashed;background:linear-gradient(160deg,rgba(255,122,184,.12),rgba(139,92,246,.12))}
.soon h3{font:700 20px Unbounded,Arial,sans-serif;margin-bottom:8px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--mut)}
.chip.on{background:var(--text);color:#000;border-color:var(--text)}
.crumbs{font-size:13px;color:var(--mut);margin-bottom:22px}
.crumbs a:hover{color:var(--pink)}
.pdp{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,5vw,64px);align-items:start}
.gal{display:grid;gap:12px}
.gal .main{aspect-ratio:4/5;border-radius:20px;border:1px solid var(--line);background:radial-gradient(circle at 50% 40%,#2a2a36,#0a0a0e);overflow:hidden}
.gal .main img{width:100%;height:100%;object-fit:contain;padding:12px}
.thumbs{display:flex;gap:10px}
.thumbs button{width:76px;height:76px;border-radius:12px;border:2px solid var(--line);background:#0d0d12;padding:0;overflow:hidden}
.thumbs button.on{border-color:var(--pink)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info h1{font-size:clamp(26px,3.4vw,40px);margin-bottom:10px}
.info .price{font-size:26px;margin:14px 0 20px}
.info p{color:#c2c2cc;margin:0 0 18px}
.lbl{font-weight:700;font-size:13px;color:var(--mut);margin:18px 0 8px}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sz{min-width:52px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:700}
.sz.on{background:var(--grad);color:#14001f;border-color:transparent}
.buy{display:flex;gap:12px;margin:26px 0;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{width:40px;height:44px;background:none;border:0;font-size:18px}
.qty span{min-width:26px;text-align:center;font-weight:700}
.facts{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:18px;color:var(--mut);font-size:14px}
.facts div{display:flex;justify-content:space-between;gap:16px}
.facts b{color:var(--text);font-weight:600}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:start}
.box{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:22px}
.row{display:grid;grid-template-columns:84px 1fr auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row img{width:84px;height:84px;object-fit:contain;border-radius:12px;background:#0b0b10}
.row .n{font-weight:700}
.row .m{color:var(--mut);font-size:13px}
.row .qty{margin-top:8px;transform:scale(.88);transform-origin:left}
.rm{background:none;border:0;color:var(--mut);font-size:13px;text-decoration:underline;margin-left:8px}
.sum{display:grid;gap:12px;position:sticky;top:90px}
.sum .l{display:flex;justify-content:space-between;color:var(--mut)}
.sum .t{display:flex;justify-content:space-between;font:700 20px Unbounded,Arial,sans-serif;border-top:1px solid var(--line);padding-top:14px;color:var(--text)}
.empty{text-align:center;padding:60px 10px;color:var(--mut)}
.empty h2{color:var(--text);font-size:26px;margin-bottom:10px}
form{display:grid;gap:14px}
fieldset{border:0;padding:0;margin:0 0 6px;display:grid;gap:12px}
legend{font:700 16px Unbounded,Arial,sans-serif;margin-bottom:12px;padding:0}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.in{display:grid;gap:5px;font-size:13px;color:var(--mut);font-weight:600}
input,textarea{background:#0b0b10;border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--text);font:inherit;font-size:15px;width:100%}
input:focus,textarea:focus{border-color:var(--pink);outline:0}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;font-weight:600;transition:border-color .15s,background .15s}
.opt small{display:block;color:var(--mut);font-weight:400}
.opt:has(input:checked){border-color:var(--pink);background:rgba(255,122,184,.07)}
.opt input{width:auto;accent-color:var(--pink)}
.cardf{display:none;grid-template-columns:1fr 1fr;gap:12px}
.cardf.on{display:grid}
.cardf .full{grid-column:1/-1}
.note{font-size:12px;color:var(--mut)}
.ok{text-align:center;padding:70px 10px;max-width:560px;margin:0 auto}
.ok h1{font-size:clamp(28px,4vw,44px);margin-bottom:14px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.txtpage{max-width:760px}
.txtpage h1{font-size:clamp(28px,4vw,46px);margin-bottom:24px}
.txtpage h3{font:700 18px Unbounded,Arial,sans-serif;margin:28px 0 8px}
.txtpage p,.txtpage li{color:#c2c2cc}
.cts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}
.cts a{display:block;border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--s1);font-weight:700;transition:border-color .2s}
.cts a:hover{border-color:var(--pink)}
.cts small{display:block;color:var(--mut);font-weight:400}
footer{border-top:1px solid var(--line);padding:32px var(--pad);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--mut);font-size:14px}
footer nav{margin:0;gap:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--text);color:#000;font-weight:700;border-radius:999px;padding:12px 22px;z-index:70;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* orders & tracking */
.ord{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:20px}
.ord-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.ord-h h3{font-size:18px}
.ord-d{color:var(--mut);font-size:13px}
.st{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;background:rgba(139,92,246,.16);color:var(--ice);border:1px solid rgba(139,92,246,.5)}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pink)}
.st.fin{background:rgba(80,200,140,.14);border-color:rgba(80,200,140,.5);color:#a6f0c8}
.st.fin::before{background:#50c88c}
.ord-body{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;margin-top:18px}
.oi{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.oi:last-of-type{border:0}
.oi img{width:56px;height:56px;object-fit:contain;border-radius:10px;background:#0b0b10}
.oi small{display:block;color:var(--mut)}
.ometa{display:grid;gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);color:var(--mut);font-size:13px}
.ometa div{display:flex;justify-content:space-between;gap:12px}
.ometa b{color:var(--text);font-weight:600;text-align:right}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;display:grid;grid-template-columns:24px 1fr;gap:12px;padding-bottom:20px;color:var(--mut)}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li.done::before{background:var(--violet)}
.tl .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;color:transparent;z-index:1}
.tl li.done .dot{background:var(--grad);border-color:transparent;color:#14001f}
.tl li.now .dot{border-color:var(--pink);background:var(--bg);box-shadow:0 0 0 0 rgba(255,122,184,.6);animation:pulse 1.8s infinite}
.tl li.now .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--pink)}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(255,122,184,0)}100%{box-shadow:0 0 0 0 rgba(255,122,184,0)}}
.tl li.done,.tl li.now{color:var(--text)}
.tl b{display:block;font-size:15px}
.tl small{font-size:12px;color:var(--mut)}
@media (max-width:820px){.ord-body{grid-template-columns:1fr}}
@media (max-width:820px){
 header{gap:12px}
 .burger{display:block;margin-left:auto}
 nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--line);padding:8px var(--pad);margin:0}
 nav.open{display:flex}
 nav a{padding:14px 0;border:0}
 .cartlink{order:3}
 .hero{grid-template-columns:1fr;min-height:0}
 .hero .txt{padding-bottom:0}
 .hero figure img{height:380px}
 .tiles,.pdp,.two{grid-template-columns:1fr}
 .tile{min-height:280px}
 .sum{position:static}
 .row{grid-template-columns:64px 1fr}
 .row img{width:64px;height:64px}
 .row>b{grid-column:2}
 .f2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lang{display:flex;gap:3px;margin-left:8px}
.lang button{border:1px solid var(--line);background:transparent;padding:6px 9px;font-size:12px;font-weight:700;color:var(--mut);border-radius:8px}
.lang button.on{background:var(--text);color:#000;border-color:var(--text)}
.paybox{display:grid;gap:16px;margin:22px 0;text-align:left}
.paybox .l{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.paybox .l span{grid-column:1/-1;font-size:13px;color:var(--mut)}
.paybox .l b{font:700 18px Unbounded,Arial,sans-serif;word-break:break-all}
@media (max-width:820px){.lang{order:2;margin-left:0}}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/">cardinal<i>.group</i></a>
  <nav id="nav">
    <a href="#/" data-r="home">Главная</a>
    <a href="#/catalog" data-r="catalog">Каталог</a>
    <a href="#/delivery" data-r="delivery">Доставка и оплата</a>
    <a href="#/orders" data-r="orders">Мои покупки <b id="ocnt" style="display:none;background:var(--grad);color:#14001f;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:4px"></b></a>
    <a href="#/contacts" data-r="contacts">Контакты</a>
  </nav>
  <a class="cartlink" href="#/cart" aria-label="Корзина">Корзина <b id="cnt">0</b></a>
  <div class="lang" id="lang"><button data-lang="ru">RU</button><button data-lang="en">EN</button><button data-lang="uk">UA</button></div>
  <button class="burger" id="burger" aria-label="Меню">☰</button>
</header>
<main id="app"></main>
<footer>
  <span>© cardinal.group</span>
  <nav><a href="#/catalog">Каталог</a><a href="#/orders">Мои покупки</a><a href="#/delivery">Доставка и оплата</a><a href="#/contacts">Контакты</a></nav>
</footer>

function tr(h){if(LANG==='ru')return h;var k=LANG==='en'?1:2;for(var i=0;i<DICT.length;i++){var r=DICT[i];if(h.indexOf(r[0])>-1)h=h.split(r[0]).join(r[k])}return h}
function markNav(){var n=(location.hash||'#/').slice(2).split('/')[0]||'home';document.querySelectorAll('#nav a').forEach(function(a){a.classList.toggle('on',a.dataset.r===(n==='product'?'catalog':n))})}
function applyStatic(){document.documentElement.lang=LANG;
  document.querySelectorAll('#nav,footer,.cartlink').forEach(function(e){if(e._o===undefined)e._o=e.innerHTML;e.innerHTML=tr(e._o)});
  document.querySelectorAll('[aria-label]').forEach(function(e){if(e._a===undefined)e._a=e.getAttribute('aria-label');e.setAttribute('aria-label',tr(e._a))});
  document.querySelectorAll('#lang button').forEach(function(b){b.classList.toggle('on',b.dataset.lang===LANG)});
  updCnt();updOcnt();markNav()}
function setLang(l){if(!LOC[l])return;LANG=l;try{localStorage.setItem('cg_lang',l)}catch(e){}applyStatic();rerender()}
var API='/api/order'; // serverless-функция (api/order.js)
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var cart=[];
try{cart=JSON.parse(localStorage.getItem('cg_cart')||'[]')||[]}catch(e){cart=[]}
function save(){try{localStorage.setItem('cg_cart',JSON.stringify(cart))}catch(e){}}
function fmt(n){return n.toLocaleString(LOC[LANG])+' ₴'}
function total(){return cart.reduce(function(a,i){return a+i.price*i.q},0)}
function count(){return cart.reduce(function(a,i){return a+i.q},0)}
function byId(id){return P.filter(function(p){return p.id===id})[0]}
function toast(t){var e=document.getElementById('toast');e.textContent=tr(t);e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},1800)}
function addToCart(id,size,q){
  var p=byId(id),ex=cart.filter(function(i){return i.id===id&&i.size===size})[0];
  if(ex)ex.q+=q;else cart.push({id:id,size:size,q:q,price:p.price,name:p.name,img:p.imgs[0]});
  save();updCnt()}

var STAGES=[
 {t:'Заказ принят',d:'Мы получили заказ и проверяем его'},
 {t:'Отправляется',d:'Заказ собран и передаётся перевозчику'},
 {t:'В дороге',d:'Посылка едет к вам'},
 {t:'Прибыл в отделение',d:'Можно забирать, срок хранения 5 дней'},
 {t:'Получен',d:'Заказ у вас. Спасибо!'}
];
/* TRACK_DEMO=true: статусы меняются за минуты (для показа). Поставьте false для реальных сроков. */
var TRACK_DEMO=true;
var STEP_MS=TRACK_DEMO?[0,25e3,70e3,130e3,200e3]:[0,6*36e5,24*36e5,48*36e5,72*36e5];
var orders=[];
try{orders=JSON.parse(localStorage.getItem('cg_orders')||'[]')||[]}catch(e){orders=[]}
function saveOrders(){try{localStorage.setItem('cg_orders',JSON.stringify(orders))}catch(e){}updOcnt()}
function updOcnt(){var e=document.getElementById('ocnt');if(!e)return;e.textContent=orders.length;e.style.display=orders.length?'inline-block':'none'}
function addOrder(o){orders=orders.filter(function(x){return x.id!==o.id});orders.unshift(o);saveOrders()}
function stageOf(o){
  if(typeof o.srv==='number')return Math.max(0,Math.min(STAGES.length-1,o.srv));
  var el=Date.now()-o.t,k=0;for(var i=0;i<STEP_MS.length;i++)if(el>=STEP_MS[i])k=i;return k}
function fdt(ts){var d=new Date(ts);return d.toLocaleDateString(LOC[LANG],{day:'numeric',month:'long'})+', '+d.toLocaleTimeString(LOC[LANG],{hour:'2-digit',minute:'2-digit'})}
/* Если на сервере есть GET /api/order?id=... -> {stage:0..4, ttn:"..."} , статус берётся оттуда */
function syncOrders(){
  orders.forEach(function(o){
    if(stageOf(o)>=STAGES.length-1&&typeof o.srv==='number')return;
    fetch(API+'?id='+encodeURIComponent(o.id)).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
      if(j&&typeof j.stage==='number'){o.srv=j.stage;if(j.ttn)o.ttn=j.ttn;saveOrders();if((location.hash||'').indexOf('#/orders')===0)rerender()}
    }).catch(function(){})})}
function orderCard(o){
  var st=stageOf(o),fin=st===STAGES.length-1,hasSrv=typeof o.srv==='number';
  var items=o.items.map(function(i){var pr=byId(i.id);return '<div class="oi"><img src="'+(pr?pr.imgs[0]:(i.img||''))+'" alt=""><div>'+esc(i.name)+'<small>Размер '+esc(i.size)+' · '+i.q+' шт.</small></div><b>'+fmt(i.price*i.q)+'</b></div>'}).join('');
  var tl=STAGES.map(function(s,k){
    var cls=k<st||(fin&&k===st)?'done':(k===st?'now':'');
    var when=(!hasSrv&&k<=st)?'<small>'+fdt(o.t+STEP_MS[k])+'</small>':'';
    return '<li class="'+cls+'"><span class="dot">✓</span><div><b>'+s.t+'</b><small>'+(k===st&&!fin?s.d:(k<st||fin&&k===st?'':s.d))+'</small>'+(when?'<br>'+when:'')+'</div></li>'}).join('');
  return '<article class="ord"><div class="ord-h"><div><h3>Заказ '+esc(o.id)+'</h3><span class="ord-d">'+fdt(o.t)+'</span></div><span class="st '+(fin?'fin':'')+'">'+STAGES[st].t+'</span></div>'
  +'<div class="ord-body"><div>'+items+'<div class="ometa">'
  +'<div><span>Оплата</span><b>'+(o.pay==='card'?'Переводом на карту':'Наложенный платёж')+'</b></div>'+(o.pay==='card'?'<div><span>Статус оплаты</span><b>'+(o.sent?'Оплата на проверке':'<a href="#/pay/'+esc(o.id)+'" style="color:var(--pink)">Ожидает оплаты. Оплатить</a>')+'</b></div>':'')
  +'<div><span>Доставка</span><b>'+(o.ship==='np'?'Новая почта':'Укрпочта')+', '+esc(o.city)+', '+esc(o.dep)+'</b></div>'
  +(o.ttn?'<div><span>Номер накладной</span><b>'+esc(o.ttn)+'</b></div>':'')
  +'<div><span>Итого</span><b>'+fmt(o.total)+'</b></div></div></div>'
  +'<ol class="tl" aria-label="Статус заказа">'+tl+'</ol></div></article>'}

  function opt(n,v,t,s,c){return '<label class="opt"><input type="radio" name="'+n+'" value="'+v+'" '+(c?'checked':'')+'><span>'+t+'<small>'+s+'</small></span></label>'}
  return '<section class="wrap"><div class="crumbs"><a href="#/">Главная</a> / <a href="#/cart">Корзина</a> / Оформление</div><div class="sec"><h2>Оформление заказа</h2></div><div class="two"><form id="f" novalidate>'
  +'<fieldset><legend>Контакты</legend><div class="f2"><label class="in">Имя и фамилия<input name="name" required autocomplete="name"></label><label class="in">Телефон<input name="phone" type="tel" required placeholder="+380" autocomplete="tel"></label></div><label class="in">Email (необязательно)<input name="email" type="email" autocomplete="email"></label></fieldset>'
  +'<fieldset><legend>Доставка</legend>'+opt('ship','np','Новая почта','Отделение или почтомат',state.ship==='np')+opt('ship','up','Укрпочта','Отделение',state.ship==='up')
  +'<div class="f2"><label class="in">Город<input name="city" required autocomplete="address-level2"></label><label class="in">Отделение или индекс<input name="dep" required></label></div></fieldset>'
  +'<fieldset><legend>Оплата</legend>'+opt('pay','card','Переводом на карту Monobank','Реквизиты на следующем шаге',state.pay==='card')+opt('pay','cod','Наложенный платёж','Оплата при получении',state.pay==='cod')
  +'<p class="note">Данные вашей карты на сайте не вводятся: вы сами переводите сумму в приложении своего банка.</p></fieldset>'
  +'<label class="in">Комментарий к заказу<textarea name="note" rows="2"></textarea></label></form>'
  +'<div class="box sum"><h3 style="font-size:18px">Ваш заказ</h3>'+items+'<div class="t"><span>Итого</span><span>'+fmt(total())+'</span></div><button class="btn" id="place">'+(state.pay==='card'?'Перейти к оплате':'Оформить заказ')+'</button><a class="btn ghost" href="#/cart">Назад в корзину</a></div></div></section>'};
V.done=function(a){cart=[];save();updCnt();var o=orders.filter(function(x){return x.id===a[0]})[0];return '<section class="wrap"><div class="ok"><h1>Заказ принят</h1><p>Номер заказа: <b>'+esc(a[0]||'CG-00000')+'</b></p><p class="note">Мы свяжемся с вами для подтверждения и отправим заказ.</p>'+(o?'<p><a class="btn" data-sent="'+esc(o.id)+'" href="'+tgLink(o,false)+'" target="_blank" rel="noopener">Отправить заказ в Telegram</a></p><p class="note">Нажмите, чтобы мы сразу увидели заказ в Telegram.</p>':'')+'<p class="note">Статус доставки смотрите в разделе «Мои покупки».</p><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><a class="btn ghost" href="#/orders">Отследить заказ</a><a class="btn ghost" href="#/catalog">Продолжить покупки</a></div></div></section>'};
V.pay=function(a){var o=orders.filter(function(x){return x.id===a[0]})[0];if(!o)return V.notfound();cart=[];save();updCnt();
  function r(l,v,c){return '<div class="l"><span>'+l+'</span><b>'+v+'</b><button class="rm" data-copy="'+c+'">Скопировать</button></div>'}
  return '<section class="wrap"><div class="ok" style="max-width:620px"><h1>Оплата заказа</h1><p>Заказ <b>'+esc(o.id)+'</b></p><div class="box paybox">'+r('Номер карты',cardFmt(PAY.card),PAY.card)+r('Сумма',o.total+' ₴',o.total)+r('Комментарий к переводу',esc(o.id),esc(o.id))+'</div><p class="note">Сначала переведите точную сумму на карту в приложении банка. Затем нажмите «Я оплатил(а)»: откроется Telegram с готовым сообщением, отправьте его, и мы подтвердим заказ.</p><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px"><a class="btn" data-sent="'+esc(o.id)+'" href="'+tgLink(o,true)+'" target="_blank" rel="noopener">Я оплатил(а)</a><a class="btn ghost" href="#/orders">Мои покупки</a></div></div></section>'};
V.delivery=function(){return '<section class="wrap"><div class="txtpage"><div class="crumbs"><a href="#/">Главная</a> / Доставка и оплата</div><h1>Доставка и оплата</h1><h3>Доставка</h3><p>Отправляем Новой почтой и Укрпочтой по всей Украине. Заказ уходит в течение 1–3 рабочих дней после подтверждения.</p><h3>Оплата</h3><p>Переводом на карту Monobank (реквизиты показываются после оформления) или наложенным платежом при получении на отделении. После перевода нажмите «Я оплатил(а)», и мы подтвердим заказ в Telegram.</p><h3>Размеры</h3><p>Крой оверсайз: S, M, L, XL. Если сомневаетесь, берите свой обычный размер.</p><h3>Возврат</h3><p>Напишите нам в течение 14 дней после получения, если размер не подошёл. Товар должен быть без следов носки.</p></div></section>'};
V.contacts=function(){return '<section class="wrap"><div class="txtpage"><div class="crumbs"><a href="#/">Главная</a> / Контакты</div><h1>Контакты</h1><p>Вопросы по заказу, размерам и сотрудничеству.</p><div class="cts"><a href="https://t.me/sutenervi" target="_blank" rel="noopener">Telegram<small>@sutenervi</small></a></div></div></section>'};
V.notfound=function(){return '<section class="wrap"><div class="empty"><h2>Страница не найдена</h2><a class="btn" href="#/">На главную</a></div></section>'};

function route(){
  var h=(location.hash||'#/').slice(2).split('/'),name=h[0]||'home',args=h.slice(1);
  if(name==='product'){state.shot=0;state.qty=1}
  if(name==='orders')syncOrders();
  var fn=V[name]||V.notfound;
  var app=document.getElementById('app');
  app.innerHTML=tr('<div class="page">'+fn(args)+'</div>');
  markNav();
  document.getElementById('nav').classList.remove('open');
  window.scrollTo(0,0);
}
function rerender(){var y=window.scrollY,h=(location.hash||'#/').slice(2).split('/'),fn=V[h[0]||'home']||V.notfound;document.getElementById('app').innerHTML=tr('<div class="page" style="animation:none">'+fn(h.slice(1))+'</div>');window.scrollTo(0,y)}
window.addEventListener('hashchange',route);

document.addEventListener('click',function(e){
  var sl=e.target.closest('[data-sent]');if(sl){var so=orders.filter(function(x){return x.id===sl.dataset.sent})[0];if(so){so.sent=1;saveOrders()}}var t=e.target.closest('button');if(!t)return;var d=t.dataset;if(d.lang){setLang(d.lang);return}if(d.copy){try{navigator.clipboard.writeText(d.copy);toast('Скопировано')}catch(x){toast(d.copy)}return}
  if(t.id==='burger'){document.getElementById('nav').classList.toggle('open');return}
  if(d.shot!==undefined){state.shot=+d.shot;rerender();return}
  if(d.size){state.size=d.size;rerender();return}
  if(d.q){state.qty=Math.max(1,state.qty+(+d.q));rerender();return}
  if(d.add){addToCart(d.add,state.size,state.qty);toast('Добавлено в корзину');return}
  if(d.now){addToCart(d.now,state.size,state.qty);location.hash='#/checkout';return}
  if(d.ci!==undefined){var i=cart[+d.ci];i.q+=+d.d;if(i.q<1)cart.splice(+d.ci,1);save();updCnt();rerender();return}
  if(d.del!==undefined){cart.splice(+d.del,1);save();updCnt();rerender();return}
  if(t.id==='place'){
    var f=document.getElementById('f'),ok=true;
    f.querySelectorAll('[required]').forEach(function(x){var bad=!x.value.trim();x.style.borderColor=bad?'#ff5d6c':'';if(bad)ok=false});
    if(!ok){toast('Заполните обязательные поля');return}
    var v=function(n){return f.elements[n]?f.elements[n].value.trim():''};
    var body={pay:state.pay,ship:state.ship,customer:{name:v('name'),phone:v('phone'),email:v('email'),city:v('city'),dep:v('dep'),note:v('note')},items:cart.map(function(i){return{id:i.id,size:i.size,q:i.q}})};
    var lbl=t.textContent;t.disabled=true;t.textContent=tr('Подождите…');
    function finish(id,j,local){
      addOrder({id:id,t:Date.now(),local:!!local,pay:state.pay,name:body.customer.name,phone:body.customer.phone,note:body.customer.note,ship:state.ship,city:body.customer.city,dep:body.customer.dep,total:total(),
        items:cart.map(function(i){return{id:i.id,name:i.name,size:i.size,q:i.q,price:i.price}})});
      if(!local&&j&&j.pageUrl)location.href=j.pageUrl;else location.hash=(state.pay==='card'?'#/pay/':'#/done/')+id}
    fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(j){if(!r.ok)throw{srv:r.status};return j})})
    .then(function(j){finish((j&&j.order)||('CG-'+String(Date.now()).slice(-6)),j,false)})
    .catch(function(e){
      if(e&&e.srv&&e.srv!==404&&e.srv!==405){t.disabled=false;t.textContent=lbl;toast('Сервер отклонил заказ, попробуйте ещё раз');return}
      finish('CG-'+String(Date.now()).slice(-6),null,true)});
    return}
});
document.addEventListener('change',function(e){
  if(e.target.name==='pay'){state.pay=e.target.value;document.getElementById('place').textContent=tr(state.pay==='card'?'Перейти к оплате':'Оформить заказ')}
  if(e.target.name==='ship')state.ship=e.target.value;
});
applyStatic();route();
</script>
</body>
</html>
